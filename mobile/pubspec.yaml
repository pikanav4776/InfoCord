name: infocord_mobile
description: InfoCord — end-to-end encrypted notes (Android & iOS)
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.2
  url_launcher: ^6.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: "#0E0F11"
  adaptive_icon_foreground: assets/icons/app_icon_foreground.png

flutter_native_splash:
  color: "#0E0F11"
  image: assets/icons/splash_logo.png
  android_12:
    color: "#0E0F11"
    image: assets/icons/splash_logo.png

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
